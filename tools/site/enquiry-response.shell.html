<!doctype html>
<html lang="en" data-theme="<?= theme ?>" data-theme-effective="<?= theme ?>">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{name}}</title>
  <link rel="stylesheet" href="{{domain}}/assets/css/core/00-orchestrator/style.css">
  <link rel="stylesheet" href="{{domain}}/assets/css/layers/site/label/enquiry-response.css">
</head>
<body class="enquiry-response">
  <main class="enquiry-response__card">
    <img class="enquiry-response__logo" src="{{logo}}" alt="{{logoAlt}}">

    <a class="enquiry-response__return" href="{{returnUrl}}"><img src="{{returnIcon}}" alt="" width="24" height="24"><span>{{returnLabel}}</span></a>
