<article class="artist-profile hub" data-public-artist data-artist-username="{{username}}">
  {{latestRelease}}
  <section class="site-section artist-biography">{{portrait}}<{{artistHeading}} data-artist-name>{{name}}</{{artistHeading}}><p data-artist-status role="status" hidden></p><div data-artist-fields>{{yearsActive}}<p class="reading">{{biography}}</p></div><nav class="information-links label-actions" aria-label="{{name}}">{{contextLinks}}</nav></section>
  <section class="site-section artist-connections" data-artist-links>{{links}}</section>
  {{portfolio}}{{releases}}
</article>
