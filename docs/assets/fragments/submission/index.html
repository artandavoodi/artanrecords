<div class="submission-journey">
  <header class="submission-journey__hero"><div><p class="eyebrow">{{title}}</p><h1>{{headline}}</h1></div><div class="submission-journey__introduction"><p class="reading">{{introduction}}</p><div class="label-home-actions"><a href="#artist-conversation" data-emphasis="primary">{{startLabel}}</a></div><p class="muted">{{processLabel}}</p></div></header>
  <div class="submission-journey__steps">{{channels}}</div>
  <section class="submission-journey__conversation" id="artist-conversation"><header><h2>{{conversationTitle}}</h2><p class="reading">{{conversationDescription}}</p><p class="reading muted">{{notice}}</p></header>{{form}}</section>
  <nav class="information-links label-actions submission-journey__resources" aria-label="{{title}}">{{journeyLinks}}</nav>
</div>
