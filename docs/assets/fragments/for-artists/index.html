<div class="artist-journey">
  <section class="artist-journey__hero"><p class="eyebrow">{{title}}</p><h1>{{headline}}</h1><p class="reading">{{introduction}}</p><div class="label-home-actions"><a href="#artist-conversation">{{startLabel}}</a></div><p class="artist-journey__cue">{{processLabel}}</p></section>
  <div class="artist-journey__steps">{{channels}}</div>
  <section class="artist-journey__conversation" id="artist-conversation"><h2>{{conversationTitle}}</h2><p class="reading">{{conversationDescription}}</p><p class="reading muted">{{notice}}</p>{{form}}</section>
</div>
